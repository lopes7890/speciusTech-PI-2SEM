<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECIUS</title>
    <link rel="stylesheet" href="./style.css">
    <!-- FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="montserrat">
    <header class="container">
        <div class="header">
            <a href="">
                <div class="header-logo">
                    <img src="./imgs/logo/Group 6.svg" alt="" width="90px">
                    <img src="./imgs/logo/SPECIUS.svg" alt="" width="90px" class="logo-SPECIUS">
                </div>
            </a>
            <nav class="navbar">
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#projetos">Projetos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero-section" id="inicio">
            <div class="hero-container">
                <div class="efx" style="top: -800px; right: -800px;"></div>
                <div class="efx" style="bottom: -800px; left: -800px;"></div>
                <div class="container">
                    <div class="hero-content">
                        <div class="hero-logo">
                            <img src="./imgs/logo/Group 6.svg" alt="" width="600px">
                            <img src="./imgs/logo/SPECIUS.svg" alt="" width="600px">
                        </div>
                        <div class="hero-content-text montserrat">
                            <h1>Soluções únicas feitas <br>especialmente para você com</h1>
                            <div class="animation-container">
                                <div class="hero-animation">
                                    <span>Confiabilidade</span>
                                    <span>Segurança</span>
                                    <span>Performance</span>
                                    <span>Inovação</span>
                                </div>
                            </div>
                        </div>
                        <a href="#sobre" class="btn-hero">Conheça nossas soluções</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- SEÇÃO SOBRE -->
        <section class="sobre-section montserrat" id="sobre">
            <div class="container">
                <div class="sobre-content">
                    <div class="sobre-content-text">
                        <h2>Quem somos?</h2>
                        <p>Somos a SPECUIS, uma impresa tech voltada para desenvolvimento de softwares com inovação e qualidade.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
